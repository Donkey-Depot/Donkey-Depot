<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020b09">

    <title>Donkey Depot | Environmental Technology & Sustainable Solutions</title>
    <meta name="description" content="Donkey Depot is a global environmental technology aggregator and vocational impact enterprise connecting sustainable solutions, innovation, and communities.">
    <meta name="robots" content="index, follow">

    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script>
        window.si = window.si || function () {
            (window.siq = window.siq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #020b09;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: radial-gradient(
                ellipse at center,
                rgba(12, 74, 48, .22),
                transparent 65%
            );
        }

        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, white 100%, transparent),
                radial-gradient(2px 2px at 70% 30%, white 100%, transparent),
                radial-gradient(1px 1px at 40% 80%, white 100%, transparent),
                radial-gradient(2px 2px at 90% 70%, white 100%, transparent),
                radial-gradient(1px 1px at 25% 60%, white 100%, transparent);
            background-size: 250px 250px;
            opacity: .45;
            animation: stars 8s linear infinite;
        }

        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-250px); }
        }

        .earth-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 65px;
            animation: float 5s ease-in-out infinite;
        }

        .earth {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            background:
                radial-gradient(circle at 35% 30%,
                    #a4a39a 0%,
                    #656d63 22%,
                    #303d38 48%,
                    #101e1b 75%,
                    #020907 100%);
            box-shadow:
                inset -35px -15px 55px #000,
                inset 12px 10px 35px rgba(255,255,255,.12),
                0 0 35px rgba(100,120,110,.15);
            animation: heal 1.8s ease-in-out forwards;
        }

        .earth::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 35% 30%,
                    #514a36 0 12%,
                    transparent 13%),
                radial-gradient(ellipse at 70% 55%,
                    #63513d 0 17%,
                    transparent 18%),
                radial-gradient(ellipse at 30% 70%,
                    #766047 0 10%,
                    transparent 11%);
            opacity: .9;
            animation: nature 1.8s ease-in-out forwards;
        }

        .earth::after {
            content: "";
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                transparent 55%,
                rgba(0,0,0,.6) 100%
            );
        }

        .atmosphere {
            position: absolute;
            inset: -12px;
            border: 2px solid rgba(50,130,95,.15);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(50,150,95,.12);
            animation: atmosphere 1.8s ease-in-out forwards;
        }

        .energy {
            position: absolute;
            inset: -35px;
            border: 1px solid rgba(30,255,140,0);
            border-radius: 50%;
            animation: energy 1.8s ease-in-out forwards;
        }

        .ring {
            position: absolute;
            inset: -55px;
            border: 1px solid rgba(55,255,145,0);
            border-radius: 50%;
            animation: ring 1.8s ease-in-out forwards;
        }

        .content {
            position: absolute;
            bottom: 12%;
            text-align: center;
            z-index: 5;
            width: 90%;
            animation: appear .5s ease forwards;
        }

        .brand {
            font-size: 12px;
            letter-spacing: 6px;
            color: #61d99a;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(25px, 5vw, 43px);
            letter-spacing: 2px;
            font-weight: 500;
            margin-bottom: 15px;
            animation: textGlow 1.8s ease-in-out forwards;
        }

        p {
            font-size: 14px;
            color: #a6bdb1;
            letter-spacing: 1px;
        }

        .progress {
            width: 180px;
            height: 2px;
            margin: 25px auto 0;
            background: rgba(255,255,255,.1);
            overflow: hidden;
        }

        .progress span {
            display: block;
            width: 0;
            height: 100%;
            background: #43dc91;
            animation: load 1.8s linear forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes heal {
            0%, 20% {
                filter: saturate(.15) brightness(.55);
            }
            55% {
                filter: saturate(.65) brightness(.8);
            }
            100% {
                filter: saturate(1.3) brightness(1.05);
                box-shadow:
                    inset -35px -15px 55px #00140c,
                    0 0 35px rgba(42,255,130,.45),
                    0 0 90px rgba(42,255,130,.25);
            }
        }

        @keyframes nature {
            0%, 20% {
                opacity: .9;
                filter: grayscale(1);
            }
            55% {
                opacity: .65;
                filter: grayscale(.5) sepia(.4);
            }
            100% {
                opacity: .35;
                filter: grayscale(0) sepia(.3) hue-rotate(65deg);
            }
        }

        @keyframes atmosphere {
            0%, 20% {
                border-color: rgba(160,130,90,.1);
                box-shadow: none;
            }
            100% {
                border-color: rgba(50,255,145,.65);
                box-shadow: 0 0 40px rgba(50,255,145,.35);
            }
        }

        @keyframes energy {
            0% {
                transform: scale(.8);
                opacity: 0;
            }
            35% {
                opacity: .8;
                border-color: rgba(50,255,145,.7);
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
                border-color: rgba(50,255,145,.1);
            }
        }

        @keyframes ring {
            0%, 35% {
                opacity: 0;
                transform: scale(.7);
            }
            65% {
                opacity: .8;
                border-color: rgba(50,255,145,.6);
            }
            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        @keyframes textGlow {
            0%, 30% {
                color: #a9aaa5;
            }
            100% {
                color: #b9ffd4;
                text-shadow: 0 0 25px rgba(50,255,145,.25);
            }
        }

        @keyframes load {
            to { width: 100%; }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .earth-container {
                width: 220px;
                height: 220px;
            }

            .content {
                bottom: 13%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <main class="scene">
        <div class="stars" aria-hidden="true"></div>

        <div class="earth-container" aria-hidden="true">
            <div class="ring"></div>
            <div class="energy"></div>
            <div class="atmosphere"></div>
            <div class="earth"></div>
        </div>

        <div class="content">
            <div class="brand">DONKEY DEPOT</div>

            <h1>A Better World Begins.</h1>

            <p>Restoring nature. Rebuilding tomorrow.</p>

            <div class="progress" role="progressbar"
                 aria-label="Loading homepage"
                 aria-valuemin="0"
                 aria-valuemax="100">
                <span></span>
            </div>
        </div>
    </main>

    <script>
        // Redirect to the existing homepage after 2 seconds.
        setTimeout(() => {
            window.location.replace("../../src/pages/home/Home.html");
        }, 2000);
    </script>
</body>
</html>
